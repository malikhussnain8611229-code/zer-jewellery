{% extends "base.html" %}
{% block title %}Create Account — ZÉR Jewellery{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="ZÉR">
      <h1>ZÉR</h1>
      <p>— JEWELLERY —</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2 class="auth-title">Join ZÉR</h2>
      <p class="auth-sub">Create your account and enter the world of luxury jewellery.</p>
      <form class="auth-form" action="{{ url_for('register') }}" method="post">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-input" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" class="form-input" placeholder="+92 300 0000000">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>
      <div class="auth-footer" style="margin-top:1.5rem">
        <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
